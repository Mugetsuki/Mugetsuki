<link rel="stylesheet" href="../../pikora-site/tokens.css">
<style>

  .saat { align-self: center; font-size: 26px; font-weight: 700; opacity: .6; }
  .kunye { display: flex; align-items: center; justify-content: space-between; font: 700 36px/1 "Baloo 2"; color: var(--ip-bordo); }
  .kunye svg { height: 58px; width: auto; }
  .kunye small { font: 600 24px/1.2 "Nunito"; color: #1E2A4F; opacity: .7; text-align: right; }

    "7-siparis": { kim: "chika", zemin: "nane", saat: "Bugün 21:33", s: [

  };
  var q = new URLSearchParams(location.search);
  if (q.has("liste")) { document.body.textContent = Object.keys(M).join(" "); return; }
  var m = M[q.get("m") || "1-pay"], p = P[m.kim];
  if (innerHeight < 1600) document.body.className = "gonderi";
  document.body.style.setProperty("--zemin", Z[m.zemin]);
  document.body.innerHTML = '<div class="s"><p class="baslik">Patiden mesaj var</p><div class="ust">' + p.svg + "<div><b>" + p.ad + "</b><span>" + p.durum + '</span></div></div><div class="akis"><p class="saat">' + m.saat + "</p>" +
